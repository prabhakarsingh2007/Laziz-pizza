<aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800">
    <!-- Brand / Title -->
    <div class="p-6 border-b border-slate-800 flex items-center gap-3">
        <span class="text-2xl">🍕</span>
        <div>
            <h2 class="font-bold text-white text-lg">Admin Panel</h2>
            <p class="text-xs text-slate-500">Laziz Pizza Management</p>
        </div>
    </div>

    <!-- Navigation links -->
    <nav class="flex-1 p-4 space-y-2 mt-4">
        <a href="{% url 'dashboard' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition duration-150 {% if request.resolver_match.url_name == 'dashboard' %}bg-red-600 text-white hover:bg-red-700{% endif %}">
            <span>📊</span>
            <span class="font-medium">Dashboard Overview</span>
        </a>
        <a href="{% url 'food_list' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition duration-150 {% if request.resolver_match.url_name == 'food_list' or request.resolver_match.url_name == 'add_food' or request.resolver_match.url_name == 'edit_food' or request.resolver_match.url_name == 'delete_food' %}bg-red-600 text-white hover:bg-red-700{% endif %}">
            <span>🍕</span>
            <span class="font-medium">Manage Menu</span>
        </a>
        <a href="{% url 'admin_orders' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition duration-150 {% if request.resolver_match.url_name == 'admin_orders' %}bg-red-600 text-white hover:bg-red-700{% endif %}">
            <span>🛍️</span>
            <span class="font-medium">Manage Orders</span>
        </a>
        <a href="{% url 'admin_reservations' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition duration-150 {% if request.resolver_match.url_name == 'admin_reservations' %}bg-red-600 text-white hover:bg-red-700{% endif %}">
            <span>📅</span>
            <span class="font-medium">Manage Bookings</span>
        </a>
        <a href="{% url 'admin_users' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition duration-150 {% if request.resolver_match.url_name == 'admin_users' %}bg-red-600 text-white hover:bg-red-700{% endif %}">
            <span>👥</span>
            <span class="font-medium">Manage Users</span>
        </a>
        <a href="/"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition duration-150 mt-10">
            <span>🌐</span>
            <span class="font-medium">View Website</span>
        </a>
        <a href="{% url 'sales' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition duration-150 {% if request.resolver_match.url_name == 'sales' %}bg-red-600 text-white hover:bg-red-700{% endif %}">
            <span>💰</span>
            <span class="font-medium">Sales Report</span>
        </a>
    </nav>

    <!-- Footer info / User info -->
    <div class="p-4 border-t border-slate-800 bg-slate-950/50">
        <div class="flex items-center gap-3">
            <div class="bg-red-600 h-10 w-10 rounded-full flex items-center justify-center text-white font-bold">
                {{ request.session.name|slice:":1"|upper }}
            </div>
            <div>
                <p class="text-sm font-semibold text-white">{{ request.session.name }}</p>
                <p class="text-xs text-slate-500">@{{ request.session.username }}</p>
            </div>
        </div>
    </div>
</aside>
