{% extends 'dashboard/dashboard_base.html' %}

{% block title %}
Delete Food Item
{% endblock %}

{% block dashboard_content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8 text-center border border-gray-100">
    <div class="text-6xl text-red-500 mb-6">
        ⚠️
    </div>
    <h1 class="text-3xl font-bold text-red-600 mb-4">
        Delete Food Item
    </h1>
    
    <p class="text-gray-600 mb-8 leading-relaxed">
        Are you sure you want to delete <strong>{{ food.name }}</strong>? This action will permanently remove it from the menu.
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="flex justify-center gap-4">
            <a href="{% url 'food_list' %}"
               class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-semibold transition duration-200">
                Cancel
            </a>
            <button type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-semibold transition duration-200">
                Delete
            </button>
        </div>
    </form>
</div>
{% endblock %}
