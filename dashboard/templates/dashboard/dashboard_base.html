{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col md:flex-row min-h-screen -mx-4 -my-6">
    <!-- Sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Main Content Area -->
    <main class="flex-1 p-6 md:p-10 bg-gray-50 flex flex-col">
        <!-- Dashboard Top Header Bar -->
        <div class="flex justify-between items-center bg-white border border-slate-100 rounded-2xl px-6 py-4 mb-8 shadow-sm">
            <div class="text-sm font-medium text-slate-500">
                Welcome to Restaurant Administration Panel
            </div>
            
            <div class="flex items-center gap-6">
                <!-- Notification Bell -->
                <div class="relative">
                    <a href="{% url 'admin_orders' %}" class="text-slate-600 hover:text-red-650 transition text-xl relative p-1.5 hover:bg-slate-50 rounded-xl block">
                        🔔
                        {% if total_orders %}
                        <span id="notification-count"
                              class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold rounded-full px-1.5 py-0.5 leading-none">
                            {{ total_orders }}
                        </span>
                        {% endif %}
                    </a>
                </div>
                
                <!-- Admin Username Display -->
                <div class="flex items-center gap-2 border-l pl-6 border-slate-100">
                    <span class="bg-gradient-to-r from-red-600 to-amber-500 text-white text-xs font-black w-8 h-8 rounded-full flex items-center justify-center shadow-md">
                        A
                    </span>
                    <span class="text-sm font-bold text-slate-700">@{{ request.session.username }}</span>
                </div>
            </div>
        </div>

        <div class="flex-1">
            {% block dashboard_content %}
            {% endblock %}
        </div>
    </main>
</div>

{% load static %}
<!-- Notification Audio -->
<audio id="notifySound">
    <source src="{% static 'sounds/notification.mp3' %}" type="audio/mpeg">
</audio>

<script>
let old_count = {{ total_orders|default:0 }};

setInterval(function(){

    fetch("{% url 'order_count' %}")
    .then(response => response.json())
    .then(data => {

        if(data.count > old_count){

            const playAlert = (timesLeft) => {
                if (timesLeft <= 0) return;
                const sound = document.getElementById("notifySound");
                if (sound) {
                    sound.loop = false;
                    sound.currentTime = 0;
                    sound.play().catch(error => console.log("Autoplay blocked:", error));
                    
                    setTimeout(function() {
                        sound.pause();
                        sound.currentTime = 0;
                        
                        setTimeout(function() {
                            playAlert(timesLeft - 1);
                        }, 1000);
                    }, 2000);
                }
            };

            playAlert(3);
            
            const badge = document.getElementById("notification-count");
            if (badge) {
                badge.innerHTML = data.count;
            } else {
                location.reload();
            }

            old_count = data.count;
        }

    });

}, 5000);
</script>
{% endblock %}
