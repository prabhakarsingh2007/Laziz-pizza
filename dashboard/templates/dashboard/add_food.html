{% extends 'dashboard/dashboard_base.html' %}

{% block title %}
Add New Food Item
{% endblock %}

{% block dashboard_content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-8 border border-gray-100">
    <h1 class="text-3xl font-bold text-red-600 mb-8 text-center">
        ➕ Add New Food Item
    </h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="space-y-6">
            {% for field in form %}
            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                <div class="text-red-500 text-sm mt-1">
                    {{ field.errors }}
                </div>
                {% endif %}
            </div>
            {% endfor %}
        </div>

        <div class="mt-8 flex gap-4 justify-end">
            <a href="{% url 'food_list' %}"
               class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-semibold transition duration-200">
                Cancel
            </a>
            <button type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-lg font-semibold transition duration-200">
                Save Food
            </button>
        </div>
    </form>
</div>
{% endblock %}
