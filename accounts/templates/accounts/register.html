{% extends 'base.html' %}

{% block title %}
Create Account
{% endblock %}

{% block content %}

<div class="container mx-auto px-6 py-12 max-w-lg">

    <div class="bg-white border border-slate-100 shadow-xl rounded-2xl p-8">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black tracking-tight text-slate-800">Create Account</h2>
            <div class="h-1.5 w-12 bg-red-600 mx-auto mt-3 rounded-full"></div>
            <p class="text-gray-400 text-xs mt-3">Join Laziz Pizza to order food online & track active deliveries.</p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-slate-700 font-bold mb-2 text-sm">Full Name</label>
                <input type="text" name="name" placeholder="Enter Full Name" required
                       class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-500 text-slate-800 text-sm">
            </div>

            <div>
                <label class="block text-slate-700 font-bold mb-2 text-sm">Username</label>
                <input type="text" name="username" placeholder="Choose Username" required
                       class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-500 text-slate-800 text-sm">
            </div>

            <div>
                <label class="block text-slate-700 font-bold mb-2 text-sm">Email Address</label>
                <input type="email" name="email" placeholder="name@example.com" required
                       class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-500 text-slate-800 text-sm">
            </div>

            <div>
                <label class="block text-slate-700 font-bold mb-2 text-sm">Phone Number</label>
                <input type="text" name="phone" placeholder="Enter phone number" required
                       class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-500 text-slate-800 text-sm">
            </div>

            <div>
                <label class="block text-slate-700 font-bold mb-2 text-sm">Password</label>
                <input type="password" name="password" placeholder="Create Password" required
                       class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-500 text-slate-800 text-sm">
            </div>

            <div>
                <label class="block text-slate-700 font-bold mb-2 text-sm">Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm Password" required
                       class="w-full border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-500 text-slate-800 text-sm">
            </div>

            <button type="submit" 
                    class="w-full bg-gradient-to-r from-red-600 to-amber-500 hover:brightness-110 text-white font-bold py-3.5 rounded-xl transition duration-150 shadow-lg shadow-red-900/20 text-center">
                Register
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-slate-500">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-red-600 font-bold hover:underline ml-1">Login here</a>
        </div>
    </div>

</div>

{% endblock %}
