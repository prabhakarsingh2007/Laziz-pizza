{% extends 'base.html' %}

{% block title %}
Order Success
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8 my-10 text-center">
    <div class="text-6xl text-green-500 mb-6">
        🎉
    </div>
    <h1 class="text-3xl font-bold text-green-600 mb-4">
        Order Placed Successfully!
    </h1>
    
    <p class="text-gray-600 mb-8 leading-relaxed">
        Thank you for your order! Your delicious pizza is being prepared and will be delivered to your doorstep shortly.
    </p>

    <div class="flex justify-center gap-4">
        <a href="{% url 'menu' %}"
           class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-semibold transition duration-200">
            Order More
        </a>
        <a href="{% url 'my_orders' %}"
           class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-3 rounded-lg font-semibold transition duration-200">
            My Orders
        </a>
    </div>
</div>
{% endblock %}
