{% load static %}
<nav class="sticky top-0 z-50 bg-gradient-to-r from-red-600 to-red-700 text-white p-3 shadow-lg transition-all duration-300">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <!-- Logo Image -->
        <a href="/" class="flex items-center hover:opacity-90 transition duration-150">
            <img src="{% static 'images/logo.png' %}" alt="Laziz Pizza" class="h-11 md:h-13 object-contain">
        </a>

        <!-- Links -->
        <ul class="flex gap-8 items-center text-sm font-semibold tracking-wide">
            <li><a href="/" class="text-white hover:text-yellow-200 transition duration-150">Home</a></li>
            <li><a href="{% url 'menu' %}" class="text-white hover:text-yellow-200 transition duration-150">Menu</a></li>
            {% if request.session.user_id %}
                <li><a href="{% url 'reservation' %}" class="text-white hover:text-yellow-200 transition duration-150">Reservation</a></li>
                <li>
                    <a href="{% url 'cart' %}" class="text-white hover:text-yellow-200 transition duration-150 flex items-center gap-1.5 bg-white/10 px-3.5 py-1.5 rounded-full border border-white/20">
                        <span>🛒</span> Cart <span class="bg-yellow-300 text-red-750 text-xs font-bold px-2 py-0.5 rounded-full">{{ cart_count }}</span>
                    </a>
                </li>
                <li><a href="{% url 'my_orders' %}" class="text-white hover:text-yellow-200 transition duration-150">My Orders</a></li>
                <li><a href="{% url 'dashboard' %}" class="text-white hover:text-yellow-200 transition duration-150">Dashboard</a></li>
                <li><span class="text-yellow-200 font-bold ml-2">Hi, {{ request.session.name }}</span></li>
                <li><a href="{% url 'logout' %}" class="text-white hover:text-yellow-200 transition duration-150 ml-2 bg-red-800/50 px-4 py-2 rounded-xl border border-red-500/30">Logout</a></li>
            {% else %}
                <li><a href="{% url 'login' %}" class="text-white hover:text-yellow-200 transition duration-150">Login</a></li>
                <li>
                    <a href="{% url 'register' %}" class="bg-white text-red-600 hover:bg-red-50 px-5 py-2.5 rounded-xl font-bold shadow-lg shadow-red-900/20 transition duration-150">
                        Register
                    </a>
                </li>
            {% endif %}
        </ul>
    </div>
</nav>
